{% extends "base.html" %}
{% block title %}乘车人管理{% endblock %}
{% block content %}
<div class="container my-4">
    <div class="row">
        <div class="col-md-7">
            <div class="card">
                <div class="card-header bg-white"><strong>我的乘车人</strong></div>
                {% if passengers %}
                <table class="table mb-0">
                    <thead class="table-light"><tr><th>姓名</th><th>身份证号</th><th>手机号</th></tr></thead>
                    <tbody>
                        {% for p in passengers %}
                        <tr><td>{{ p.name }}</td><td>{{ p.id_card }}</td><td>{{ p.phone }}</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
                {% else %}
                <div class="card-body text-muted">暂无乘车人</div>
                {% endif %}
            </div>
        </div>
        <div class="col-md-5">
            <div class="card p-4">
                <h5>添加乘车人</h5>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">姓名</label>
                        <input type="text" name="name" class="form-control" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">身份证号</label>
                        <input type="text" name="id_card" class="form-control" maxlength="18" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">手机号</label>
                        <input type="tel" name="phone" class="form-control" maxlength="11" required>
                    </div>
                    <button type="submit" class="btn btn-primary">添加</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
