{% extends "base.html" %}
{% block title %}支付订单 - Mini-12306{% endblock %}
{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card p-4 text-center">
                <h4 class="mb-4"><i class="bi bi-credit-card text-primary"></i> 在线支付</h4>
                <p class="text-muted">订单号：{{ order.order_no }}</p>
                <h2 class="text-danger my-4">¥{{ "%.2f"|format(order.total_amount) }}</h2>
                <p class="text-muted small">模拟支付接口，点击确认即可完成支付</p>
                <form method="POST">
                    <button type="submit" class="btn btn-primary btn-lg w-100" onclick="return confirm('确认支付 ¥{{ order.total_amount }}？')">
                        确认支付
                    </button>
                </form>
                <a href="{{ url_for('order.my_orders') }}" class="btn btn-link mt-3">稍后支付</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
