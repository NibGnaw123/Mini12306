{% extends "base.html" %}
{% block title %}支付订单 - Mini-12306{% endblock %}
{% block content %}
<div class="container my-5 py-3">
    <div class="card auth-card text-center">
        <div class="auth-icon"><i class="bi bi-credit-card"></i></div>
        <h4 class="fw-bold mb-1">在线支付</h4>
        <p class="text-muted mb-0">订单号 {{ order.order_no }}</p>
        <div class="pay-amount my-4">¥{{ "%.2f"|format(order.total_amount) }}</div>
        <p class="text-muted small mb-4">
            <i class="bi bi-info-circle me-1"></i>模拟支付接口，点击确认即可完成支付
        </p>
        <form method="POST">
            <button type="submit" class="btn btn-primary btn-lg w-100 py-2"
                    onclick="return confirm('确认支付 ¥{{ order.total_amount }}？')">
                <i class="bi bi-shield-check me-1"></i>确认支付
            </button>
        </form>
        <a href="{{ url_for('order.my_orders') }}" class="btn btn-link mt-3">稍后支付</a>
    </div>
</div>
{% endblock %}
