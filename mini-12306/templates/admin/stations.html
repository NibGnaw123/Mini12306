{% extends "base.html" %}
{% block title %}车站管理{% endblock %}
{% block content %}
<div class="container my-4">
    <div class="d-flex justify-content-between mb-3">
        <h4>车站管理</h4>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-sm btn-outline-secondary">返回后台</a>
    </div>
    <div class="row">
        <div class="col-md-8">
            <div class="card">
                <table class="table mb-0">
                    <thead class="table-light"><tr><th>站名</th><th>城市</th><th>代码</th></tr></thead>
                    <tbody>
                        {% for s in stations %}
                        <tr><td>{{ s.name }}</td><td>{{ s.city }}</td><td>{{ s.code }}</td></tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card p-3">
                <h6>添加车站</h6>
                <form method="POST">
                    <div class="mb-2"><input type="text" name="name" class="form-control form-control-sm" placeholder="站名" required></div>
                    <div class="mb-2"><input type="text" name="city" class="form-control form-control-sm" placeholder="城市" required></div>
                    <div class="mb-2"><input type="text" name="code" class="form-control form-control-sm" placeholder="代码" required></div>
                    <button type="submit" class="btn btn-primary btn-sm">添加</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
