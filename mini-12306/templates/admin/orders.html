{% extends "base.html" %}
{% block title %}订单管理{% endblock %}
{% block content %}
<div class="container my-4">
    <div class="d-flex justify-content-between mb-3">
        <h4>订单管理</h4>
        <a href="{{ url_for('admin.dashboard') }}" class="btn btn-sm btn-outline-secondary">返回后台</a>
    </div>
    <div class="card">
        <table class="table table-sm mb-0">
            <thead class="table-light">
                <tr><th>订单号</th><th>用户</th><th>状态</th><th>金额</th><th>下单时间</th></tr>
            </thead>
            <tbody>
                {% for o in orders %}
                <tr>
                    <td>{{ o.order_no }}</td>
                    <td>{{ o.user.username }}</td>
                    <td>{{ o.status }}</td>
                    <td>¥{{ "%.2f"|format(o.total_amount) }}</td>
                    <td>{{ o.created_at.strftime('%Y-%m-%d %H:%M') }}</td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endblock %}
