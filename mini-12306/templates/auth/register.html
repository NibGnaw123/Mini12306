{% extends "base.html" %}
{% block title %}注册 - Mini-12306{% endblock %}
{% block content %}
<div class="container my-5 py-3">
    <div class="card auth-card" style="max-width: 520px;">
        <div class="auth-icon"><i class="bi bi-person-plus"></i></div>
        <h3 class="text-center fw-bold mb-1">实名注册</h3>
        <p class="text-center text-muted mb-4">填写真实信息完成账号注册</p>
        <form method="POST">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label fw-semibold">用户名</label>
                    <input type="text" name="username" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">密码</label>
                    <input type="password" name="password" class="form-control" minlength="6" required>
                </div>
                <div class="col-12">
                    <label class="form-label fw-semibold">真实姓名</label>
                    <input type="text" name="real_name" class="form-control" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">身份证号</label>
                    <input type="text" name="id_card" class="form-control" maxlength="18" required
                           placeholder="18位身份证号码">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-semibold">手机号</label>
                    <input type="tel" name="phone" class="form-control" maxlength="11" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2 mt-4">注册</button>
        </form>
        <p class="text-center mt-3 mb-0 text-muted small">
            <i class="bi bi-shield-check me-1"></i>注册时将调用实名认证服务验证身份信息
        </p>
    </div>
</div>
{% endblock %}
