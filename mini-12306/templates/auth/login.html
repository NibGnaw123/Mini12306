{% extends "base.html" %}
{% block title %}登录 - Mini-12306{% endblock %}
{% block content %}
<div class="container my-5 py-4">
    <div class="card auth-card">
        <div class="auth-icon"><i class="bi bi-person-circle"></i></div>
        <h3 class="text-center fw-bold mb-1">欢迎回来</h3>
        <p class="text-center text-muted mb-4">登录您的 Mini-12306 账号</p>
        <form method="POST">
            {% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
            <div class="mb-3">
                <label class="form-label fw-semibold">用户名</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                    <input type="text" name="username" class="form-control border-start-0" placeholder="请输入用户名" required>
                </div>
            </div>
            <div class="mb-4">
                <label class="form-label fw-semibold">密码</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                    <input type="password" name="password" class="form-control border-start-0" placeholder="请输入密码" required>
                </div>
            </div>
            <button type="submit" class="btn btn-primary w-100 py-2">登录</button>
        </form>
        <p class="text-center mt-4 mb-0 text-muted">
            还没有账号？<a href="{{ url_for('auth.register') }}" class="fw-semibold">立即注册</a>
        </p>
    </div>
</div>
{% endblock %}
